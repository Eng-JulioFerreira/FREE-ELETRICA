# SPDX-License-Identifier: GPL-3.0-only
# Compila no Windows e no Linux, gera o .zip e o .AppImage e publica os dois na aba Releases. Disparado à
# mão, em Actions, só depois da autorização de release (veja a política de Git no CLAUDE.md).
name: Release

on:
  workflow_dispatch:
    inputs:
      versao:
        description: "Versão, sem o v (ex.: 0.3.0)"
        required: true
        default: "0.3.0"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compilar e empacotar
        shell: pwsh
        run: ./scripts/package_release.ps1 -Versao "${{ inputs.versao }}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: dist/FreeEletrica-v${{ inputs.versao }}-win64.zip

  linux:
    # Ubuntu antigo: o AppImage roda nas distribuições com a glibc dele ou mais nova.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - name: Bibliotecas do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config curl file desktop-file-utils \
            libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev
      - name: Compilar e empacotar
        run: bash scripts/package_appimage.sh --versao "${{ inputs.versao }}"
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: dist/FreeEletrica-v${{ inputs.versao }}-x86_64.AppImage

  publicar:
    needs: [windows, linux]
    # Versão fixa: o rótulo ubuntu-latest passa para o Ubuntu 26 a partir de outubro de 2026.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: pacotes
          merge-multiple: true
      - name: Publicar
        env:
          GH_TOKEN: ${{ github.token }}
          VERSAO: ${{ inputs.versao }}
        run: |
          set -euo pipefail
          arquivos=(pacotes/FreeEletrica-v$VERSAO-win64.zip pacotes/FreeEletrica-v$VERSAO-x86_64.AppImage)
          if gh release view "v$VERSAO" >/dev/null 2>&1; then
            gh release upload "v$VERSAO" "${arquivos[@]}" --clobber
          else
            # Sai como rascunho: o AppImage é testado num Linux antes de a Release ficar pública.
            gh release create "v$VERSAO" "${arquivos[@]}" --draft --target "$GITHUB_SHA" \
              --title "Free Elétrica v$VERSAO (Windows x64 e Linux x86_64)" \
              --notes "Versão compilada pronta para uso. Windows: baixe o .zip, extraia em qualquer pasta e execute FreeEletrica.exe. Linux: baixe o .AppImage, marque como executável (chmod +x) e execute. Não precisa instalar o Rust nem scripts."
          fi
