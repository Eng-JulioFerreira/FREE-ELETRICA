[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "craft-ele"
version = "0.1.0"
description = "Motor Open Source de Dimensionamento e Documentação Elétrica (NBR 5410) integrado ao CADCraft"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "ezdxf>=1.4.0",
    "networkx>=3.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
